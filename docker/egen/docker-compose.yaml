# SPDX-License-Identifier: MPL-2.0
#
# Penpot pour EGEN — déploiement basé sur les images OFFICIELLES penpotapp/*
# à la version épinglée, avec deux fichiers nginx de ce fork montés en lecture
# seule (PENPOT_FRAME_ANCESTORS : embarquement en iframe dans le Core).
#
# Écarts volontaires par rapport à docker/images/docker-compose.yaml (upstream) :
#   - version épinglée (PENPOT_VERSION) au lieu du défaut périmé 2.18 ;
#   - PENPOT_FRAME_ANCESTORS, PENPOT_PUBLIC_URI et PENPOT_SECRET_KEY OBLIGATOIRES
#     (le démarrage échoue avec un message clair s'ils manquent) ;
#   - mots de passe et drapeaux pilotés par l'environnement (.env) ;
#   - télémétrie désactivée par défaut ;
#   - ports publiés sur 127.0.0.1 uniquement (derrière un reverse proxy TLS).
# Les fichiers montés correspondent à la version épinglée : les mettre à jour
# avec elle (voir README.md).

x-flags: &penpot-flags
  PENPOT_FLAGS: ${PENPOT_FLAGS:-disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp}

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:?PENPOT_PUBLIC_URI est obligatoire (ex. https://design.exemple.org)}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY est obligatoire (ex. openssl rand -base64 64)}

x-database: &penpot-database
  PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:

services:
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-2.19.3}"
    restart: always
    ports:
      - "${PENPOT_BIND:-127.0.0.1:9001}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
      # EGEN : embarquement en iframe. Fichiers du fork, alignés sur PENPOT_VERSION.
      - ../images/files/nginx-entrypoint.sh:/entrypoint.sh:ro
      - ../images/files/nginx-security-headers.conf.template:/tmp/nginx-security-headers.conf.template:ro
    depends_on:
      - penpot-backend
      - penpot-admin-console
      - penpot-mcp
      - penpot-exporter
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-http-body-size, *penpot-public-uri]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_FRAME_ANCESTORS: ${PENPOT_FRAME_ANCESTORS:?PENPOT_FRAME_ANCESTORS est obligatoire (origine(s) du Core, ex. https://core.exemple.org)}
      PENPOT_CSP_MODE: ${PENPOT_CSP_MODE:-report-only}

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-2.19.3}"
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size, *penpot-secret-key, *penpot-database]
      PENPOT_ADMIN_CONSOLE_URI: http://penpot-admin-console:3000
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: ${PENPOT_TELEMETRY_ENABLED:-false}
      PENPOT_SMTP_DEFAULT_FROM: ${PENPOT_SMTP_DEFAULT_FROM:-no-reply@example.com}
      PENPOT_SMTP_DEFAULT_REPLY_TO: ${PENPOT_SMTP_DEFAULT_REPLY_TO:-no-reply@example.com}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST:-penpot-mailpit}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT:-1025}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME:-}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD:-}
      PENPOT_SMTP_TLS: ${PENPOT_SMTP_TLS:-false}
      PENPOT_SMTP_SSL: ${PENPOT_SMTP_SSL:-false}

  penpot-admin-console:
    image: "penpotapp/admin-console:${PENPOT_VERSION:-2.19.3}"
    restart: always
    depends_on:
      penpot-postgres:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-public-uri, *penpot-secret-key, *penpot-database]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080

  penpot-mcp:
    image: "penpotapp/mcp:${PENPOT_VERSION:-2.19.3}"
    restart: always
    networks:
      - penpot

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-2.19.3}"
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    networks:
      - penpot
    environment:
      << : [*penpot-flags, *penpot-secret-key, *penpot-public-uri]
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: "postgres:15"
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - penpot
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  # Courrier de développement uniquement : en production, renseigner PENPOT_SMTP_*.
  penpot-mailpit:
    image: axllent/mailpit:v1
    restart: always
    profiles: ["dev"]
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - penpot
